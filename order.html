<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSAWS-Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
            <div class="container">
                <a class="navbar-brand fw-bold" href="index.html" data-i18n="brand">JSAWS-Store Order</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                    <ul class="navbar-nav align-items-center">
                        <li class="nav-item"><a class="nav-link" href="index.html" data-i18n="nav_main">Main</a></li>
                        <li class="nav-item"><a class="nav-link" href="products.html" data-i18n="nav_products">Products</a></li>
                        <li class="nav-item"><a class="nav-link" href="#" data-bs-toggle="modal" data-bs-target="#contactModal" data-i18n="nav_contacts">Contacts</a></li>
                        <!-- Language Switcher -->
                        <li class="nav-item ms-lg-3">
                            <select id="langSwitch" class="form-select form-select-sm bg-secondary text-white border-0">
                                <option value="en">EN</option>
                                <option value="ru">RU</option>
                            </select>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container my-5 pt-5">
        <h2 class="text-center mb-4" data-i18n="order_title">Placing an order</h2>
        
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm p-4">
                    <h4 class="mb-3" data-i18n="order_details">Your order details</h4>
                    
                    <div class="alert alert-secondary">
                        <p class="mb-1"><strong data-i18n="selected_product">Selected product:</strong> <span id="orderProductName" class="text-primary fw-bold" data-i18n="not_selected">Not selected</span></p>
                        <p class="mb-1"><strong data-i18n="price_label">Price:</strong> <span id="orderProductPrice" class="fw-bold">0 $</span></p>
                        <p class="mb-1"><strong data-i18n="queue_label">Your queue number:</strong> <span id="queueNumber" class="badge bg-warning text-dark">№ 4</span></p>
                        <p class="mb-0"><strong data-i18n="ready_label">Estimated ready time:</strong> <span id="readyTime" class="text-success fw-bold">-</span></p>
                    </div>

                    <form id="checkoutForm">
                        <div class="mb-3">
                            <label class="form-label" data-i18n="full_name">Your full name</label>
                            <input type="text" class="form-control" id="customerName" required placeholder="Enter your name">
                        </div>
                        <div class="mb-3">
                            <label class="form-label" data-i18n="phone_label">Phone number</label>
                            <input type="tel" class="form-control" id="customerPhone" required placeholder="+7 (---) --- -- --">
                        </div>
                        <div class="mb-3">
                            <label class="form-label" data-i18n="address_label">Delivery address</label>
                            <textarea class="form-control" id="customerAddress" rows="2" required placeholder="City, street, building, apartment"></textarea>
                        </div>
                        <button type="submit" class="btn btn-success w-100 py-2" data-i18n="confirm_btn">Confirm order</button>
                    </form>
                    <div id="orderAlert" class="mt-3"></div>
                </div>
            </div>
        </div>
    </main>

    <!-- Contact Modal -->
    <div class="modal fade" id="contactModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" data-i18n="modal_title">Connect with us</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="contactForm">
                        <div class="mb-3">
                            <label class="form-label" data-i18n="form_name">Name</label>
                            <input type="text" class="form-control" id="nameInput" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" data-i18n="form_email">Email</label>
                            <input type="email" class="form-control" id="emailInput" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" data-i18n="form_msg">Message</label>
                            <textarea class="form-control" id="messageInput" rows="3" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-success w-100" data-i18n="form_submit">Submit</button>
                    </form>
                    <div id="formAlert" class="mt-3"></div>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <div class="container">
            <p class="mb-0" data-i18n="footer">&copy; 2026 JSAWS. All rights reserved</p>
        </div>
    </footer>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
